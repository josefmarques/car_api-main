# Source: car-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-api
  labels:
    helm.sh/chart: car-api-0.1.0
    app.kubernetes.io/name: car-api
    app.kubernetes.io/instance: car-api
    app.kubernetes.io/version: "1.0.0"
