  selector:
    matchLabels:
      app.kubernetes.io/name: car-api
      app.kubernetes.io/instance: car-api
  template:
    metadata:
      labels:
        helm.sh/chart: car-api-0.1.0
        app.kubernetes.io/name: car-api
        app.kubernetes.io/instance: car-api
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
